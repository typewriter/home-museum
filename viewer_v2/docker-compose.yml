# viewer_v2 を立ち上げる。公開は Caddy 越しにする前提で、ポートは localhost に絞る。
# Caddy (basic_auth を含む) への載せ方は compose.https.yml と README.md。

services:
  viewer:
    build:
      context: .
    # bind mount した data/ に書けるよう、ホスト側の所有者に合わせる。
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?}
      R2_BUCKET: ${R2_BUCKET:?}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?}
      VIEWER_BASE_URL: ${VIEWER_BASE_URL:-}
      VIEWER_ARTIST_MIN_WORKS: ${VIEWER_ARTIST_MIN_WORKS:-20}
    volumes:
      # viewer.db は WAL なので、ファイル単体ではなくディレクトリごと渡す。
      # ファイル単体だと -wal / -shm がコンテナ側に取り残され、チェックポイント前の
      # 書き込みがコンテナの破棄と一緒に消える。import する works.db もここに置く。
      - ${VIEWER_DATA_DIR:-./data}:/var/lib/viewer
    restart: unless-stopped
