# finder 単体を立ち上げる。リポジトリルートの docker-compose.yml (server/viewer =
# 旧実装) とは無関係で、共有するものは何も無い。
#
#   cd finder && docker compose up --build   → http://127.0.0.1:8081
#
# hm.db と index.db はイメージに入れず volume で渡す。どちらも journal_mode=delete
# なので -wal / -shm は無く、ファイル単体の bind mount で安全に読める。

services:
  finder:
    build:
      context: .
    # bind mount した cache/ に書けるよう、ホスト側の所有者に合わせる。
    # 違う UID で動かすなら .env に UID / GID を書く。
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      # 公開はリバースプロキシ (nginx / Caddy) 越しにする前提で localhost に絞る。
      - "127.0.0.1:8081:8080"
    environment:
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?}
      R2_BUCKET: ${R2_BUCKET:?}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?}
    volumes:
      # finder も mode=ro で開くが、ATTACH 先はメイン接続の読み取り専用フラグを
      # 継承しないので (spec_collections.md §2)、:ro を二重の歯止めにする。
      #
      # 索引はホスト側で `go run . index` で作り直す。コンテナ内でやるなら
      # index.db をディレクトリごと渡して :ro を外す (index.db.building* を隣に作るため)。
      - ../importer/hm.db:/data/hm.db:ro
      - ./index.db:/data/index.db:ro
      # 書き込み先の cache.db と collections.db。どちらも WAL なので、ファイル単体
      # ではなくディレクトリごと渡す (単体だと -wal / -shm がコンテナ側に残り、
      # チェックポイント前の書き込みがコンテナと一緒に消える)。
      # collections.db は復旧できないので `finder collections export` で git に置く。
      - ${FINDER_CACHE_DIR:-./cache}:/var/lib/finder
    restart: unless-stopped
