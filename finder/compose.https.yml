# ../caddy-host (複数サービス共通の Caddy) 経由で HTTPS 公開するときの上乗せ。
# 使い方は README の「VPS へのデプロイ」。
#
# FINDER_BASE_PATH は caddy-host/Caddyfile の handle と揃えること。

services:
  finder:
    environment:
      FINDER_BASE_PATH: ${FINDER_BASE_PATH:-/art-finder}
    networks:
      - default
      - homemuseum

networks:
  homemuseum:
    external: true
