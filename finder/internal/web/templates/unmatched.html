{{define "content"}}
{{$d := .Data}}
<h1>名寄せ漏れの作者表記 <span class="muted">person_key IS NULL</span></h1>
<p class="muted">
  normalize_person.rb が人物に寄せられなかった作者エントリを、生表記ごとにまとめたもの。
  件数の多いものから潰していくと効率がよい。
</p>

<form class="filters" method="get" action="/artists/unmatched">
  <div class="row main">
    <input type="search" name="q" value="{{$d.Q}}" placeholder="name_raw に部分一致" autofocus>
    <button type="submit">絞り込む</button>
    <a class="btn ghost" href="/artists/">名寄せ済みの一覧へ</a>
  </div>
</form>

{{template "table" $d.T}}

<nav class="pager">
  {{if gt $d.Page 1}}<a href="{{urlWith $d.Query "page" (printf "%d" (add $d.Page -1))}}">← 前</a>{{end}}
  <span>{{$d.Page}}</span>
  {{if $d.HasNext}}<a href="{{urlWith $d.Query "page" (printf "%d" (add $d.Page 1))}}">次 →</a>{{end}}
</nav>
{{end}}
