events {}

http {
    server {
        listen 80;
        root   /app;
        include /etc/nginx/mime.types;

        location /v1 {
            proxy_set_header Host uchibi.nyamikan.net;
            proxy_pass http://homemuseum_api:8080;
        }

        location / {
          try_files $uri $uri/ /index.html;
        }
    }
}
